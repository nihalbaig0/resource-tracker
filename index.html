<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resource Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-inner">
        <div class="brand">
          <span class="brand-icon" aria-hidden="true">◈</span>
          <div>
            <h1>Resource Tracker</h1>
            <p class="subtitle">Your saved links, organized</p>
          </div>
        </div>
        <div class="header-actions">
          <div class="search-wrap">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
            </svg>
            <input type="search" id="search" placeholder="Search resources…" autocomplete="off">
          </div>
          <button type="button" id="add-resource-btn" class="btn-primary">
            <span aria-hidden="true">+</span> Add link
          </button>
        </div>
      </div>
    </header>

    <div id="add-modal" class="modal hidden" role="dialog" aria-labelledby="add-modal-title" aria-modal="true">
      <div id="add-modal-backdrop" class="modal-backdrop"></div>
      <div class="modal-panel">
        <div class="modal-header">
          <h2 id="add-modal-title">Add resource</h2>
          <button type="button" id="add-modal-close" class="modal-close" aria-label="Close">×</button>
        </div>
        <form id="add-form" class="modal-body">
          <label class="field">
            <span>URL</span>
            <input type="url" id="add-url" required placeholder="https://…" autocomplete="off">
          </label>
          <label class="field">
            <span>Title <small>(optional — auto-detected if empty)</small></span>
            <input type="text" id="add-title" placeholder="Article or repo name">
          </label>
          <div class="field-row">
            <label class="field">
              <span>Category</span>
              <select id="add-category" required></select>
            </label>
            <label class="field">
              <span>Subcategory</span>
              <select id="add-subcategory" required></select>
            </label>
          </div>
          <label class="field-checkbox">
            <input type="checkbox" id="add-new-subcategory-check">
            Create new subcategory
          </label>
          <label class="field hidden" id="new-subcategory-wrap">
            <span>New subcategory name</span>
            <input type="text" id="add-new-subcategory" placeholder="e.g. Blogs, Projects">
          </label>
          <label class="field">
            <span>Description <small>(optional)</small></span>
            <input type="text" id="add-description" placeholder="Short note">
          </label>
          <label class="field">
            <span>Tags <small>(optional, comma-separated)</small></span>
            <input type="text" id="add-tags" placeholder="gpu, kubernetes">
          </label>

          <div class="github-connect">
            <p id="gh-token-status" class="token-status">Connect GitHub to save links to your repo.</p>
            <div class="token-row">
              <input type="password" id="gh-token-input" placeholder="GitHub Personal Access Token" autocomplete="off">
              <button type="button" id="gh-token-save" class="btn-secondary">Connect</button>
            </div>
            <p class="hint">
              <a href="https://github.com/settings/tokens/new?scopes=repo&description=Resource%20Tracker" target="_blank" rel="noopener noreferrer">Create a token</a>
              with <code>repo</code> scope (private repos) or <code>public_repo</code> (public only).
            </p>
          </div>

          <p id="add-form-error" class="form-error" role="alert"></p>
          <p id="add-form-success" class="form-success" role="status"></p>

          <div class="modal-footer">
            <button type="button" id="add-cancel-btn" class="btn-secondary">Cancel</button>
            <button type="submit" id="add-submit-btn" class="btn-primary">Add link</button>
          </div>
        </form>
      </div>
    </div>

    <nav class="categories" id="categories" aria-label="Categories"></nav>

    <main class="main">
      <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>Loading resources…</p>
      </div>
      <div id="error" class="error hidden" role="alert"></div>
      <div id="content" class="content hidden"></div>
    </main>

    <footer class="footer">
      <p>Add links in <code>resources/categories/</code> · Deploy on GitHub Pages</p>
    </footer>
  </div>

  <script src="js/app.js" type="module"></script>
</body>
</html>
